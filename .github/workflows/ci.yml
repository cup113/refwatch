name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install dev tools
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: lint
        run: python -m ruff check .
      - name: smoke test the CLI
        run: python -X utf8 watch.py --help
      - name: unit tests
        run: python -X utf8 -m unittest discover -s tests
